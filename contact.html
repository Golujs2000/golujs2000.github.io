<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us — CGP360</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#3754ED',
                            offwhite: '#EEF3F7',
                            deepblue: '#131B62',
                            black: '#080E29',
                            white: '#F7FDFF',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-white text-slate-900">
    <div class="bg-brand-deepblue text-white">
        <div class="mx-auto max-w-7xl px-4 py-2 text-sm flex justify-between items-center">
            <span>Clinic Growth Partner</span>
            <a href="tel:+919234525942" class="flex items-center gap-1 hover:underline"><i data-lucide="phone"
                    class="w-3 h-3"></i> +91 92345 25942</a>
        </div>
    </div>

    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur border-b border-slate-200">
        <div class="mx-auto max-w-7xl px-4 py-4 flex items-center justify-between gap-4">
            <a href="index.html"><img src="./assets/logo.svg" alt="CGP360 Logo"
                    class="h-10 w-auto object-contain" /></a>
            <nav class="hidden md:flex items-center gap-6 text-sm text-slate-700">
                <a class="hover:text-slate-900" href="services.html">Services</a>
                <a class="hover:text-slate-900" href="packages.html">Packages</a>
                <a class="hover:text-slate-900 font-semibold text-brand-blue" href="contact.html">Contact</a>
                <a class="hover:text-slate-900" href="about.html">About</a>
            </nav>
            <a href="contact.html"
                class="hidden sm:inline-flex items-center justify-center rounded-xl bg-brand-deepblue px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">Get
                Free Audit</a>
        </div>
    </header>

    <main>
        <section class="bg-brand-deepblue text-white py-20 px-4">
            <div class="mx-auto max-w-3xl text-center">
                <h1 class="text-4xl font-bold">Get in touch</h1>
                <p class="mt-4 text-white/80 text-lg">We'd love to audit your clinic's presence for free.</p>
            </div>
        </section>

        <section class="py-20 px-4">
            <div class="mx-auto max-w-5xl grid lg:grid-cols-2 gap-12">
                <!-- Info -->
                <div>
                    <h2 class="text-2xl font-bold text-brand-deepblue">Contact Information</h2>
                    <div class="mt-8 space-y-6">
                        <div class="flex items-start gap-4">
                            <div
                                class="w-10 h-10 rounded-full bg-brand-blue/10 flex items-center justify-center text-brand-blue shrink-0">
                                <i data-lucide="phone" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <div class="font-semibold">Phone</div>
                                <a href="tel:+919234525942" class="text-slate-600 hover:text-brand-blue">+91 92345
                                    25942</a>
                            </div>
                        </div>
                        <div class="flex items-start gap-4">
                            <div
                                class="w-10 h-10 rounded-full bg-brand-blue/10 flex items-center justify-center text-brand-blue shrink-0">
                                <i data-lucide="message-circle" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <div class="font-semibold">WhatsApp</div>
                                <a href="https://wa.me/919234525942" class="text-slate-600 hover:text-brand-blue">Chat
                                    with us</a>
                            </div>
                        </div>
                        <div class="flex items-start gap-4">
                            <div
                                class="w-10 h-10 rounded-full bg-brand-blue/10 flex items-center justify-center text-brand-blue shrink-0">
                                <i data-lucide="mail" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <div class="font-semibold">Email</div>
                                <a href="mailto:contact@cgp360.com"
                                    class="text-slate-600 hover:text-brand-blue">contact@cgp360.com</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-100">
                    <form class="space-y-4" onsubmit="event.preventDefault(); alert('Thanks!');">
                        <div>
                            <label class="text-sm font-medium">Your Name</label>
                            <input type="text"
                                class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-brand-blue"
                                placeholder="Dr. Name">
                        </div>
                        <div>
                            <label class="text-sm font-medium">Clinic Name</label>
                            <input type="text"
                                class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-brand-blue"
                                placeholder="Clinic Name">
                        </div>
                        <div>
                            <label class="text-sm font-medium">Message</label>
                            <textarea rows="4"
                                class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-brand-blue"
                                placeholder="How can we help?"></textarea>
                        </div>
                        <button
                            class="w-full bg-brand-blue text-white rounded-xl py-3 font-semibold hover:bg-brand-blue/90">Send
                            Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-slate-200 py-10 text-center text-sm text-slate-500">
        © 2025 CGP360. All rights reserved.
    </footer>
    <script>lucide.createIcons();</script>
</body>

</html>
