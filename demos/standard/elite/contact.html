<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Elite Skin & Hair Clinic</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">Elite Clinic</div>
        <div class="hamburger">
            <i class="fas fa-bars"></i>
        </div>
        <nav class="desktop-nav">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <!-- Page Header -->
    <section class="page-header"
        style="background-image: url('assets/images/hero-new.jpg'); height: 300px; display: flex; align-items: center; justify-content: center; color: white; text-align: center; background-size: cover; background-position: center; position: relative;">
        <div style="background: rgba(0,0,0,0.4); position: absolute; top:0; left:0; width:100%; height:100%;"></div>
        <div class="header-content" style="position: relative; z-index: 1;">
            <h1 style="font-size: 3rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">Contact Us</h1>
            <p style="font-size: 1.2rem;">Book your consultation or visit our clinic.</p>
        </div>
    </section>

    <!-- Map & Contact -->
    <section class="contact-section" id="booking" style="padding: 4rem 1rem;">
        <div class="booking-form">
            <h3>Book an Appointment</h3>
            <form action="https://formsubmit.co/contact.cgp360@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="New Submission from Elite Demo">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" name="phone" placeholder="Your Phone Number" required>
                </div>
                <!-- Date/Time Picker (New Requirement) -->
                <div class="form-group">
                    <label>Preferred Date</label>
                    <input type="date" name="date" required>
                </div>
                <div class="form-group">
                    <label>Service</label>
                    <select name="service">
                        <option>Laser Toning</option>
                        <option>Anti-Ageing</option>
                        <option>Hair Treatment</option>
                        <option>Consultation</option>
                    </select>
                </div>
                <div class="form-group">
                    <button type="submit">Confirm Appointment</button>
                </div>
            </form>
        </div>
        <!-- Google Map (New Requirement) -->
        <div class="map-container">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14318.665672224016!2d85.1234567!3d25.6012345!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39ed58f1f2e1a8e1%3A0x123456789abc!2sPatna%2C%20Bihar!5e0!3m2!1sen!2sin!4v1234567890"
                allowfullscreen="" loading="lazy"></iframe>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
        </div>
        <p>&copy; 2026 Elite Skin & Hair Clinic. All rights reserved.</p>
    </footer>

    <!-- Sticky Bottom Nav -->
    <div class="sticky-bottom-nav">
        <a href="mailto:info@eliteclinic.com" class="nav-item">
            <i class="far fa-envelope"></i>
            Email
        </a>
        <a href="contact.html" class="nav-item">
            <i class="far fa-calendar-alt"></i>
            Schedule
        </a>
        <a href="tel:+919876543210" class="nav-item">
            <i class="fas fa-phone-alt"></i>
            Call
        </a>
    </div>

    <!-- Floating WhatsApp -->
    <a href="https://wa.me/919876543210" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

</body>

</html>
